name: flaresolverr

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    # ports:
    #   - "8191:8191"
    restart: unless-stopped
    networks:
      - pangolin-private-proxy

networks:
  pangolin-private-proxy:
    external: true
