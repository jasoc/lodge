name: Build and Push Container

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g.: 1.0.0) - leave empty for only sha (and latest)'
        required: false
        default: ''
      latest:
        description: 'Update the latest tag as well?'
        type: boolean
        default: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One image (server + SPA + migrator), built from the root Dockerfile with the repo
      # root as context. docker-compose.prod.yml defaults LODGE_SERVER_IMAGE to this name.
      - name: Build and push
        run: |
          # GHCR rejects uppercase in image names.
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          IMAGE="${IMAGE,,}"

          TAGS=("$IMAGE:sha-$(echo ${{ github.sha }} | cut -c1-7)")

          if [[ "${{ inputs.version }}" != "" ]]; then
            VERSION="${{ inputs.version }}"
            TAGS+=("$IMAGE:$VERSION")

            # Also move the major and major.minor tags
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -s -d. -f2)
            if [[ "$MAJOR" != "" ]]; then
              TAGS+=("$IMAGE:$MAJOR")
              if [[ "$MINOR" != "" ]]; then
                TAGS+=("$IMAGE:$MAJOR.$MINOR")
              fi
            fi
          fi

          if [[ "${{ inputs.latest }}" == "true" ]]; then
            TAGS+=("$IMAGE:latest")
          fi

          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do TAG_ARGS+=(--tag "$tag"); done

          echo "Building with tags: ${TAGS[*]}"

          docker buildx build \
            --push \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            "${TAG_ARGS[@]}" \
            --file Dockerfile \
            .
