@if (!checking()) {
  <div class="login-shell">
    <mat-card class="login-card">
      <mat-card-content>
        <h2 class="branded-font">Lodge</h2>
        <p>Sign in with your organization's identity provider to continue.</p>
        <button mat-flat-button color="primary" (click)="signIn()">Sign in with SSO</button>
      </mat-card-content>
    </mat-card>
  </div>
} @else {
  <div class="login-shell">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
}
