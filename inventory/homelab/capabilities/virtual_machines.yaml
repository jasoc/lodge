# yaml-language-server: $schema=../../../schemas/capability.schema.json
# One Proxmox VM per key under proxmox.virtual_machines. Lifecycle:
#   add    → apply_vm (Terraform creates it, MANUAL) → configure_vm (Ansible profile, AUTO)
#   modify → apply_vm_changes (Terraform updates it in place, MANUAL)
#   delete → destroy_vm (Terraform destroys it, MANUAL — only members of `admins`)
#   plan_vm (OPTIONAL, any time): what Terraform would change for this VM right now
#   verify_vm (OPTIONAL, any time): is the VM reachable over ssh — the one action here that
#     runs under the restrictive container profile, with nothing relaxed
#
# Terraform: the generic runner (playbooks/terraform) applies the `proxmox-vm` module as
# its own root with its own state — a Postgres workspace named after the item's path
# (proxmox.virtual_machines.<vm>) — one unit per VM, nothing shared, so a plain
# apply/destroy is always exactly this VM. The whole item goes in as `inputs`; fields
# the module doesn't declare (ansible_profile, backed_up, ...) are dropped. An existing VM
# can be adopted instead of created with `import_id: <node>/<vm_id>` on the item.
#
# A VM's `compose` list is excluded from its body: those files are their own capability
# (stacks.yaml), and editing the list never counts as a change to the VM.
#
# Container hardening: Lodge runs containers with every capability dropped, no new
# privileges, a read-only root filesystem and a non-root user. The Terraform and Ansible
# playbooks run as root and write to /root (ssh key, state), so they relax exactly that,
# per action, with `security:` (the &runs-as-root anchor). verify_vm relaxes nothing.
#
# Secrets: every action gets pass_pat, the Proton Pass token, from kind.yaml's defaults —
# the only credential Lodge hands over; every run fetches the rest (provider tokens, ssh
# key, state backend) from Proton Pass itself.
capability: virtual_machines
title: "VMs provision"
description: "Proxmox VMs: created and destroyed with Terraform, configured with Ansible."

signals:
  - path: proxmox.virtual_machines
    kind: keyed_collection
    exclude: [compose]
    rules:
      - on: add
        actions:
          - key: apply_vm
            label: "Create VM (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: &runs-as-root { user: image, read_only_rootfs: false }
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["apply"]
            inputs:
              module: { const: proxmox-vm }
              unit: { from: path }
              name: { from: key }
              inputs: { from: item }
              import_id: { from: item.import_id }

          - key: configure_vm
            label: "Configure VM (Ansible profile)"
            policy: AUTO
            depends_on: [ "proxmox.virtual_machines.apply_vm" ]
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/ansible, additional_contexts: { base: playbooks/_base } }
            inputs:
              vm_name: { from: key }
              vm: { from: item }
              vms: { from: collection }
              profile: { from: item.ansible_profile }
              host: { from: item.ip }

          - key: plan_vm
            label: "Plan VM (Terraform, read-only)"
            policy: OPTIONAL
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["plan"]
            inputs:
              module: { const: proxmox-vm }
              unit: { from: path }
              name: { from: key }
              inputs: { from: item }
              import_id: { from: item.import_id }

          # Runs under Lodge's restrictive container profile (no `security:` block): a
          # read-only check needs no secrets, no capabilities and no writable rootfs, so
          # it drops the kind's default secret inputs too.
          - key: verify_vm
            label: "Verify VM (ssh reachable, read-only)"
            policy: OPTIONAL
            executor: container
            container:
              build: { context: playbooks/verify }
              command: ["reachable"]
              timeout_seconds: 60
              resources: { memory: 64m, cpus: 0.5, pids: 32 }
            inputs:
              pass_pat: ~
              tf_pg_conn_str: ~
              vm_name: { from: key }
              host: { from: item.ip }

      - on: modify
        actions:
          - key: apply_vm_changes
            label: "Apply VM changes (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["apply"]
            inputs:
              module: { const: proxmox-vm }
              unit: { from: path }
              name: { from: key }
              inputs: { from: item }
              import_id: { from: item.import_id }

      - on: delete
        actions:
          - key: destroy_vm
            label: "Destroy VM (Terraform)"
            policy: MANUAL_REQUIRED
            requires: admins
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["destroy"]
            inputs:
              module: { const: proxmox-vm }
              unit: { from: path }
              name: { from: key }
              inputs: { from: item }
