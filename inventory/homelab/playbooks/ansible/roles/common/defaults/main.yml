---
# Shared NFS mounts from the NAS, every VM gets these.
common_nfs_mounts:
  - { src: "192.168.178.10:/vault", path: /vault }
  - { src: "192.168.178.10:/etc/avahi/services", path: /etc/avahi/services }

# IP of the Backrest VM — the inventory VM whose ansible_profile is backrest-node
# (empty when there is none, which skips the /volumes export). Every VM exports /volumes
# to this address only. `vms` is the whole Lodge VM map (input `vms: { from: collection }`).
common_backrest_node_ip: >-
  {{ (vms | default({}) | dict2items
      | selectattr('value.ansible_profile', 'defined')
      | selectattr('value.ansible_profile', 'equalto', 'backrest-node')
      | map(attribute='value.ip') | first | default('')).split('/') | first }}
