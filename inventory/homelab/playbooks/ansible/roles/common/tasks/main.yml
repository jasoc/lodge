---
# Ported from the homelab repo (ansible/roles/common). Runs on every VM, first thing in
# every playbook -- this is the ansible replacement for the old terraform/cloud-init.tf. It does what that
# cloud-init used to do at first boot (qemu-guest-agent, shared NFS mounts,
# firewalld off) plus exporting /volumes so the Backrest VM can
# mount and back it up (see ansible/playbooks/backrest-node.yml).

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - qemu-guest-agent
      - nfs-utils
    state: present

- name: Enable qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

# - name: Disable firewalld
#   ansible.builtin.systemd:
#     name: firewalld
#     enabled: false
#     state: stopped

- name: Ensure shared NFS mount points exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ common_nfs_mounts }}"

- name: Add shared NFS mounts to /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ item.src | regex_escape }}\\s"
    line: "{{ item.src }} {{ item.path }} nfs defaults,timeo=900,retrans=5,_netdev 0 0"
    create: true
  loop: "{{ common_nfs_mounts }}"
  register: common_fstab_result

- name: Ensure /volumes exists
  ansible.builtin.file:
    path: /volumes
    state: directory
    mode: "0755"

- name: Export /volumes to the Backrest VM via NFS
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: "^/volumes\\s"
    line: "/volumes {{ common_backrest_node_ip }}(ro,sync,no_subtree_check)"
    create: true
  register: common_exports_result
  when: common_backrest_node_ip | length > 0

- name: Enable nfs-server
  ansible.builtin.systemd:
    name: nfs-server
    enabled: true
    state: started

# - name: Mount all filesystems in fstab
#   ansible.builtin.command: mount -a
#   when: common_fstab_result.changed

- name: Reload NFS exports
  ansible.builtin.command: exportfs -ra
  when: common_exports_result is changed
