---
# Day 2 setup for a docker node: the common role (qemu-guest-agent, shared NFS mounts,
# /volumes export) then Docker itself. Lodge runs it right after Terraform created the
# VM, so it first waits for cloud-init to bring SSH up.
- name: Configure docker node
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for the VM to accept SSH (fresh from Terraform/cloud-init)
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - common
    - docker
