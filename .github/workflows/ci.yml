name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build server
        run: dotnet build server/Lodge.slnx

      - name: Test server
        run: dotnet test server/Lodge.slnx

      - name: Build CLI
        run: dotnet build cli/src/Lodge.Cli

      - name: Validate the shipped example inventory
        # Offline, same loading code as the server; --format github turns every problem
        # into an annotation on the offending file. --allow-auto-build mirrors the server's
        # DockerExecutor__AutoBuildAllowlist: without it an AUTO action with a build is an error.
        run: |
          dotnet run --project cli/src/Lodge.Cli -- validate inventory --format github \
            --allow-auto-build homelab/playbooks/ansible

      - name: Generated schemas are up to date
        # schemas/*.schema.json are generated from the catalog loader's document classes.
        run: |
          ./scripts/gen-schema.sh
          git add --intent-to-add schemas
          if ! git diff --exit-code schemas/; then
            echo "::error::schemas/ is out of date with the loader's document classes (server/src/Lodge.Core/Catalog/Documents). Run ./scripts/gen-schema.sh and commit the result."
            exit 1
          fi

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run format:check
