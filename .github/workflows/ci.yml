name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build server
        run: dotnet build server/Lodge.slnx

      - name: Test server
        run: dotnet test server/Lodge.slnx

      - name: Build CLI
        run: dotnet build cli/src/Lodge.Cli

      - name: Validate the shipped example inventory against its schema
        run: |
          dotnet run --project server/tools/validate-schema -- \
            inventory/homelab/instances/lab \
            schemas/common/instance.base.schema.json \
            schemas/kinds/homelab.instance.schema.json

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run format:check
