# Development Postgres — the only container native dev needs. The server and the SPA run
# natively (./scripts/run.sh, or ./scripts/dev-db-up.sh + your IDE) and reach it on
# localhost; the server migrates its own schema on startup. Reads the root .env.
#
# The production stack (server image, Postgres, Keycloak) is docker-compose.prod.yml — it
# shares nothing with this file, not even the data directory.
#
# Fixed project name so the container is the same one no matter what the checkout folder
# is called.
name: lodge

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres16-lodge-dev
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Loopback only — the dev database is never exposed beyond this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
