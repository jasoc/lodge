# Cloud images downloaded onto Proxmox datastores, one per key under proxmox.images — what
# a VM's `image` (a volume id, <datastore>:import/<file>) points at. Same generic Terraform
# runner as the VMs, module `proxmox-image`, one state per image.
# An image that's already on the datastore can be adopted with `import_id` on the item
# (bpg/proxmox: <node>/<datastore>:<content_type>/<file>) — creating it again fails.
capability: images
title: "Cloud Images"
description: "Images downloaded onto Proxmox datastores, for VMs to import their disk from."

signals:
  - path: proxmox.images
    kind: keyed_collection
    rules:
      - on: add
        actions:
          - key: download_image
            label: "Download image (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: &runs-as-root { user: image, read_only_rootfs: false }
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["apply"]
            inputs:
              module: { const: proxmox-image }
              unit: { from: path }
              inputs: { from: item }
              import_id: { from: item.import_id }

      - on: modify
        actions:
          - key: update_image
            label: "Apply image changes (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["apply"]
            inputs:
              module: { const: proxmox-image }
              unit: { from: path }
              inputs: { from: item }
              import_id: { from: item.import_id }

      - on: delete
        actions:
          - key: delete_image
            label: "Delete image (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["destroy"]
            inputs:
              module: { const: proxmox-image }
              unit: { from: path }
              inputs: { from: item }
