name: immich

services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v3.1.0
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    restart: always
    environment:
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
    healthcheck:
      disable: false
    networks:
      - pangolin-private-proxy
      - immich
    labels:
      - pangolin.proxy-resources.immich.name=Immich
      - pangolin.proxy-resources.immich.full-domain=immich.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.immich.protocol=http
      - pangolin.proxy-resources.immich.auth.sso-enabled=false
      - pangolin.proxy-resources.immich.targets[0].method=http
      - pangolin.proxy-resources.immich.targets[0].port=2283

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    volumes:
      - model-cache:/cache
    restart: always
    environment:
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
    healthcheck:
      disable: false
    networks:
      - immich

  redis:
    container_name: immich-valkey
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - immich

  database:
    container_name: immich-vectorchord
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${HDD_VOLUMES_BASEDIR}/immich:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    networks:
      - immich

volumes:
  model-cache:

networks:
  pangolin-private-proxy:
    external: true
  immich:
    driver: bridge
    name: immich