name: romm

services:
  romm:
    image: rommapp/romm:4.9.2
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-mariadb
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${ROMM_MARIADB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD}
      - RETROACHIEVEMENTS_API_KEY=${RETROACHIEVEMENTS_API_KEY}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
      - HASHEOUS_API_ENABLED=true
    volumes:
      - ${SSD_NVME_VOLUMES_BASEDIR}/romm/resources:/romm/resources
      - ${SSD_NVME_VOLUMES_BASEDIR}/romm/redis-data:/redis-data
      - ${SSD_NVME_VOLUMES_BASEDIR}/romm/assets:/romm/assets
      - ${SSD_NVME_VOLUMES_BASEDIR}/romm/config:/romm/config
      - ${MASS_HDD_PATH}/games/romm-library:/romm/library
    # ports:
    #   - 8080:8080
    depends_on:
      romm-mariadb:
        condition: service_healthy
        restart: true
    networks:
      - pangolin-private-proxy
      - romm
    labels:
      - pangolin.proxy-resources.romm.name=RomM
      - pangolin.proxy-resources.romm.full-domain=romm.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.romm.protocol=http
      - pangolin.proxy-resources.romm.auth.sso-enabled=false
      - pangolin.proxy-resources.romm.targets[0].method=http
      - pangolin.proxy-resources.romm.targets[0].port=8080

  romm-mariadb:
    image: mariadb:12.3.2
    container_name: romm-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${ROMM_MARIADB_PASSWORD}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${ROMM_MARIADB_PASSWORD}
    volumes:
      - ${SSD_NVME_VOLUMES_BASEDIR}/romm/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pangolin-private-proxy
      - romm

networks:
  pangolin-private-proxy:
    external: true
  romm:
    driver: bridge
