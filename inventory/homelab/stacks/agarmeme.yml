name: agarmeme

services:
  agarmeme:
    image: ghcr.io/jasoc/agarmeme:latest
    container_name: agarmeme
    # ports:
    #   - "3000:3000"
    #   - "3001:3001"
    volumes:
        - ${SSD_NVME_VOLUMES_BASEDIR}/sol2earn/db:/usr/src/app/bin/server/db
    environment:
      - SUPER_ADMIN_PASS=${ADMIN_PASSWORD}
    restart: unless-stopped
    networks:
      - pangolin-private-proxy
    labels:
      - pangolin.proxy-resources.sol2earn-game.name=Sol2earn
      - pangolin.proxy-resources.sol2earn-game.full-domain=sol2earn.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.sol2earn-game.protocol=http
      - pangolin.proxy-resources.sol2earn-game.auth.sso-enabled=false
      - pangolin.proxy-resources.sol2earn-game.targets[0].method=http
      - pangolin.proxy-resources.sol2earn-game.targets[0].port=3000
      - pangolin.proxy-resources.sol2earn-admin.name=Sol2earn admin panel
      - pangolin.proxy-resources.sol2earn-admin.full-domain=sol2earn-admin.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.sol2earn-admin.protocol=http
      - pangolin.proxy-resources.sol2earn-admin.auth.sso-enabled=false
      - pangolin.proxy-resources.sol2earn-admin.targets[0].method=http
      - pangolin.proxy-resources.sol2earn-admin.targets[0].port=3001

networks:
  pangolin-private-proxy:
    external: true