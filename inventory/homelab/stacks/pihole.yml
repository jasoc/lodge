name: pihole

services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "9080:80/tcp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: "${PIHOLE_ADMIN_PASSWORD}"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_misc_etc_dnsmasq_d: true
      DNS1: "unbound#54"
      DNS2: "unbound#54"
    volumes:
      - "${SSD_NVME_VOLUMES_BASEDIR}/pihole/etc-pihole:/etc/pihole"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    configs:
      - source: dnsmasq.conf
        target: /etc/dnsmasq.d/00-additional.conf
    restart: unless-stopped
    networks:
      - pihole
      - pangolin-private-proxy
    labels:
      - pangolin.proxy-resources.pihole.name=PiHole
      - pangolin.proxy-resources.pihole.full-domain=pihole.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.pihole.protocol=http
      - pangolin.proxy-resources.pihole.auth.sso-enabled=false
      - pangolin.proxy-resources.pihole.targets[0].method=http
      - pangolin.proxy-resources.pihole.targets[0].port=80

  unbound:
    image: "mvance/unbound:1.22.0"
    container_name: unbound
    hostname: "unbound"
    # ports:
    #   - 53:53
    restart: unless-stopped
    networks:
      - pihole

configs:
  dnsmasq.conf:
    content: |
      address=/${PRIVATE_DOMAIN}/${RPROXY_IPv4_ADDRESS}
      server=unbound

networks:
  pihole:
    driver: bridge
  pangolin-private-proxy:
    external: true