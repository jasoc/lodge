name: simple-nginx

services:
  simple-nginx:
    image: nginx:1.31.3-alpine
    container_name: simple-nginx
    ports:
      - "6482:80"
    restart: unless-stopped
    volumes:
      - ${MASS_HDD_PATH}/sources/simple-nginx:/var/www/html:ro
    configs:
      - source: nginx.conf
        target: /etc/nginx/nginx.conf
    networks:
      - pangolin-private-proxy
    labels:
      - pangolin.proxy-resources.simple-nginx.name=Simple Nginx
      - pangolin.proxy-resources.simple-nginx.full-domain=simple-nginx.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.simple-nginx.protocol=http
      - pangolin.proxy-resources.simple-nginx.auth.sso-enabled=false
      - pangolin.proxy-resources.simple-nginx.targets[0].method=http
      - pangolin.proxy-resources.simple-nginx.targets[0].port=80

configs:
  nginx.conf:
    content: |
      user                 nginx;
      pid                  /var/run/nginx.pid;
      worker_processes     auto;
      worker_rlimit_nofile 65535;

      events {
          multi_accept       on;
          worker_connections 65535;
      }

      http {
          charset                utf-8;
          sendfile               on;
          tcp_nopush             on;
          tcp_nodelay            on;
          server_tokens          off;
          log_not_found          off;
          types_hash_max_size    2048;
          types_hash_bucket_size 64;
          client_max_body_size   16M;

          # MIME
          include                mime.types;
          default_type           application/octet-stream;

          # Load configs
          server {
              listen      80;
              root        /var/www/html; 
          }
      }

networks:
  pangolin-private-proxy:
    external: true
