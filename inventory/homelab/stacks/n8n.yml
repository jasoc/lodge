name: n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.35.2
    container_name: n8n
    # ports:
    #   - 5678:5678
    volumes:
      - ${SSD_NVME_VOLUMES_BASEDIR}/n8n:/home/node/.n8n
    environment:
      - WEBHOOK_URL=https://n8n.${PUBLIC_DOMAIN}
    restart: unless-stopped
    networks:
      - pangolin-private-proxy
    labels:
      - pangolin.proxy-resources.n8n.name=n8n
      - pangolin.proxy-resources.n8n.full-domain=n8n.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.n8n.protocol=http
      - pangolin.proxy-resources.n8n.auth.sso-enabled=false
      - pangolin.proxy-resources.n8n.targets[0].method=http
      - pangolin.proxy-resources.n8n.targets[0].port=5678

networks:
  pangolin-private-proxy:
    external: true
