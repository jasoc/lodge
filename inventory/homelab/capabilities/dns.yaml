# Cloudflare DNS records, one per key under cloudflare.zones.<zone>.records (the zone
# holds its zone_id). Same generic Terraform runner, module `cloudflare-dns-record`, one
# state per record. An existing record can be adopted with `import_id: <zone_id>/<record_id>`
# on the item — creating a record that already exists fails on Cloudflare's side.
capability: dns
title: "DNS Records"
description: "Cloudflare DNS records, applied one by one with Terraform."

signals:
  - path: cloudflare.zones.*.records
    kind: keyed_collection
    rules:
      - on: add
        actions:
          - key: create_record
            label: "Create DNS record (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: &runs-as-root { user: image, read_only_rootfs: false }
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["apply"]
            inputs:
              module: { const: cloudflare-dns-record }
              unit: { from: path }
              zone_id: { from: parent.zone_id }
              inputs: { from: item }
              import_id: { from: item.import_id }

      - on: modify
        actions:
          - key: update_record
            label: "Update DNS record (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["apply"]
            inputs:
              module: { const: cloudflare-dns-record }
              unit: { from: path }
              zone_id: { from: parent.zone_id }
              inputs: { from: item }
              import_id: { from: item.import_id }

      - on: delete
        actions:
          - key: delete_record
            label: "Delete DNS record (Terraform)"
            policy: MANUAL_REQUIRED
            executor: container
            container:
              security: *runs-as-root
              build: { context: playbooks/terraform, additional_contexts: { base: playbooks/_base } }
              command: ["destroy"]
            inputs:
              module: { const: cloudflare-dns-record }
              unit: { from: path }
              zone_id: { from: parent.zone_id }
              inputs: { from: item }
