name: glance

services:
  glance:
    container_name: glance
    image: glanceapp/glance:v0.8.5
    restart: unless-stopped
    volumes:
      - ${SSD_NVME_VOLUMES_BASEDIR}/glance:/app/config
    # ports:
    #   - 8080:8080
    environment:
      - MY_SECRET_TOKEN=${GLANCE_SECRET_TOKEN}
    configs:
      - source: glance.yml
        target: /app/config/glance.yml
    networks:
      - pangolin-private-proxy
    labels:
      - pangolin.proxy-resources.glance.name=Glance
      - pangolin.proxy-resources.glance.full-domain=glance.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.glance.protocol=http
      - pangolin.proxy-resources.glance.auth.sso-enabled=false
      - pangolin.proxy-resources.glance.targets[0].method=http
      - pangolin.proxy-resources.glance.targets[0].port=8080

configs:
  glance.yml:
    content: |
      pages:
        - name: Home
          # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
          hide-desktop-navigation: true
          columns:
            - size: small
              widgets:
                - type: calendar
                  first-day-of-week: monday

                - type: rss
                  limit: 10
                  collapse-after: 3
                  cache: 12h
                  feeds:
                    - url: https://selfh.st/rss/
                      title: selfh.st
                    - url: https://ciechanow.ski/atom.xml
                    - url: https://www.joshwcomeau.com/rss.xml
                      title: Josh Comeau
                    - url: https://samwho.dev/rss.xml
                    - url: https://ishadeed.com/feed.xml
                      title: Ahmad Shadeed

                - type: twitch-channels
                  channels:
                    - theprimeagen
                    - j_blow
                    - giantwaffle
                    - cohhcarnage
                    - christitustech
                    - EJ_SA

            - size: full
              widgets:
                - type: group
                  widgets:
                    - type: hacker-news
                    - type: lobsters

                - type: videos
                  channels:
                    - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
                    - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
                    - UCsBjURrPoezykLs9EqgamOA # Fireship
                    - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
                    - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

                - type: group
                  widgets:
                    - type: reddit
                      subreddit: technology
                      show-thumbnails: true
                    - type: reddit
                      subreddit: selfhosted
                      show-thumbnails: true

            - size: small
              widgets:
                - type: weather
                  location: Mascalucia, Italy
                  units: metric
                  hour-format: 24h
                  # hide-location: true

                - type: markets
                  markets:
                    - symbol: SPY
                      name: S&P 500
                    - symbol: BTC-USD
                      name: Bitcoin
                    - symbol: NVDA
                      name: NVIDIA
                    - symbol: AAPL
                      name: Apple
                    - symbol: MSFT
                      name: Microsoft

                - type: releases
                  cache: 1d
                  # Without authentication the Github API allows for up to 60 requests per hour. You can create a
                  # read-only token from your Github account settings and use it here to increase the limit.
                  # token: ...
                  repositories:
                    - glanceapp/glance
                    - go-gitea/gitea
                    - immich-app/immich
                    - syncthing/syncthing

networks:
  pangolin-private-proxy:
    external: true