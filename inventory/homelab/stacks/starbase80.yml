name: starbase80

services:
  starbase80:
    image: jordanroher/starbase-80:1.6.6
    container_name: starbase80
    restart: unless-stopped
    environment:
      - TITLE=Sirio, Parisius Homelab
      - HOVER=underline
      - BGCOLORDARK=#000000
      - CATEGORIES=small
      # - LOGO=/starbase80.jpg
    volumes:
      # - ${SSD_NVME_VOLUMES_BASEDIR}/starbase80/public/favicon.ico:/app/public/favicon.ico
      # - ${SSD_NVME_VOLUMES_BASEDIR}/starbase80/public/logo.png:/app/public/logo.png
      - ${SSD_NVME_VOLUMES_BASEDIR}/starbase80/public/icons:/app/public/icons
    configs:
      - source: config.json
        target: /app/src/config/config.json
    networks:
      - pangolin-private-proxy
    # ports:
    #   - 4173:4173
    labels:
      - pangolin.proxy-resources.grafana.name=Starbase80
      - pangolin.proxy-resources.grafana.full-domain=dash.${PRIVATE_DOMAIN}
      - pangolin.proxy-resources.grafana.protocol=http
      - pangolin.proxy-resources.grafana.auth.sso-enabled=false
      - pangolin.proxy-resources.grafana.targets[0].method=http
      - pangolin.proxy-resources.grafana.targets[0].port=4173

